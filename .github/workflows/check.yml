# Corey Oses - Johns Hopkins University 2026
# Build aflow and run the unit tests that need no network, on Linux (g++) and macOS (Apple clang),
# on every push to main and every pull request; compiler warnings are listed as annotations
name: build and unit tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build_and_unit_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: build aflow
        shell: bash
        run: make -C src -j "$(getconf _NPROCESSORS_ONLN)" aflow 2>&1 | tee build.log
      - name: compiler warnings
        shell: bash
        run: |
          n=$(grep -c 'warning:' build.log || true)
          { grep 'warning:' build.log || true; } | sort -u | awk 'NR<=50' | while IFS= read -r w; do
            f=${w%%:*}; rest=${w#*:}; l=${rest%%:*}
            case "$l" in (*[!0-9]*|'') echo "::warning::$w";; (*) echo "::warning file=src/$f,line=$l::${w#*warning: }";; esac
          done
          echo "compiler and linker warnings: $n" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: version
        run: cd src && ./aflow --version
      - name: Makefile.aflow
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # the committed Makefile.aflow must equal the aflow --makefile output
          cd src && ./aflow --makefile > /dev/null
          git diff --exit-code -- Makefile.aflow || { echo "Makefile.aflow is out of date: run ./aflow --makefile in src and commit it"; exit 1; }
      - name: unit tests that need no network
        run: make -C src unit_test_public
